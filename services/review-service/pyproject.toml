[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xenia-review-service"
version = "0.1.0"
description = "Xenia Review Service: reviews and host replies in MongoDB, review.created on Kafka."
requires-python = ">=3.11"
dependencies = ["xenia-shared"]

[tool.setuptools.packages.find]
include = ["review_service*"]
