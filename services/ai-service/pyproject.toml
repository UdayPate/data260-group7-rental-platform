[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xenia-ai-service"
version = "0.1.0"
description = "Xenia AI Agent Service: the API, and the agents (parser, matcher, risk, fairness, explanation, chair) that debate over Kafka."
requires-python = ">=3.11"
dependencies = ["xenia-shared", "anthropic>=0.40"]

[tool.setuptools.packages.find]
include = ["ai_service*"]
