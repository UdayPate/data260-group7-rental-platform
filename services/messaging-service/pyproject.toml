[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xenia-messaging-service"
version = "0.1.0"
description = "Xenia Messaging Service: guest-host threads and messages in MongoDB, message.sent on Kafka."
requires-python = ">=3.11"
dependencies = ["xenia-shared"]

[tool.setuptools.packages.find]
include = ["messaging_service*"]
