[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xenia-booking-service"
version = "0.1.0"
description = "Xenia Booking Service: the API (accepts requests, publishes booking.requested) and the worker (holds the dates)."
requires-python = ">=3.11"
dependencies = ["xenia-shared"]

[tool.setuptools.packages.find]
include = ["booking_service*"]
