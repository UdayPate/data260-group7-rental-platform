# Serves the built frontend on port 5173. Every unknown path returns index.html, because the
# app does its own routing in the browser (/search, /properties/p_001, /ai/tasks/...).
server {
  listen 5173;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The mock service worker must always be fresh, or an old copy keeps answering.
  location = /mockServiceWorker.js {
    add_header Cache-Control "no-store";
  }
}
