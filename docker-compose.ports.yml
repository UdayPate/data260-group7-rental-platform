# Optional: also publish MySQL, Kafka, MongoDB and Redis to your laptop (evidence scripts, a database
# client, running a service in a virtualenv against the Docker data). Not needed to use the app.
#
#   docker compose -f docker-compose.yml -f docker-compose.ports.yml up -d
#
# MySQL is on 3307 by default (3306 is often taken by a MySQL installed on Windows); evidence
# scripts then need MYSQL_PORT=3307. Change a port with e.g. MYSQL_HOST_PORT=3308 in front of the command.
services:
  mysql:
    ports: ["${MYSQL_HOST_PORT:-3307}:3306"]
  kafka:
    ports: ["${KAFKA_HOST_PORT:-9092}:9092"]   # the broker tells clients "localhost:9092", so keep 9092 here
  mongo:
    ports: ["${MONGO_HOST_PORT:-27017}:27017"]
  redis:
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
