[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xenia-shared"
version = "0.1.0"
description = "Code every Xenia backend service shares: Kafka envelope, Kafka helpers, JWT check, error format, database helpers."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "PyJWT>=2.8",
  "bcrypt>=4.1",
  "PyMySQL>=1.1",
  "cryptography>=42",
  "confluent-kafka>=2.3",
  "redis>=5.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "websockets>=12"]

[tool.setuptools.packages.find]
include = ["xenia_shared*"]
